# v1.51.0 — Local AI runtime builder (S3). Cross-compiles llama.cpp
# `llama-server` (pinned tag, default b12182) for the requested Android ABIs
# with the NDK and copies it to android/app/src/main/jniLibs/<abi>/
# libllamaserver.so (git-ignored: injected at build time, never committed).
#
# v1.51.1 — cache-first rework:
#  * The cache key NO LONGER contains the NDK version (runner NDK drift was
#    invalidating the cache and the version probe itself needs the NDK).
#    A restored cache makes warm runs completely NDK-independent.
#  * NDK resolution (and the whole build) is skipped when every requested
#    ABI is already cached — the 2026 runner images stopped preinstalling
#    NDKs, so resolution must only pay its cost on a real cold build.
#  * The sdkmanager fallback now accepts licenses first and probes all the
#    known cmdline-tools locations before giving up.

name: 'llama.cpp runtime (llama-server)'
description: >-
  Cross-compile llama.cpp llama-server for Android ABIs with the NDK and
  inject it as android/app/src/main/jniLibs/<abi>/libllamaserver.so.

inputs:
  abis:
    description: 'Space-separated Android ABIs, e.g. "arm64-v8a x86_64"'
    required: true
    type: string
  llama-tag:
    description: 'llama.cpp tag to build (runtime pin)'
    required: false
    default: 'b12182'
    type: string

runs:
  using: 'composite'
  steps:
    # v1.51.1 — compute the cache-key fragment and probe which requested
    # ABIs are already present after the restore. No NDK involved: a warm
    # cache must never require an NDK (runners ship without one now).
    - name: Compute ABI coverage
      id: coverage
      shell: bash
      env:
        ABIS: ${{ inputs.abis }}
      run: |
        set -euo pipefail
        # "arm64-v8a x86_64" -> "arm64-v8a-x86_64" (safe cache-key fragment).
        ABI_KEY=$(echo "$ABIS" | tr ' ' '-')
        echo "abi-key=$ABI_KEY" >> "$GITHUB_OUTPUT"
        # Coverage is recomputed AFTER the cache restore step below (this
        # step only records the key); the build gate reads cache-matrix.
        echo "computed abi-key=$ABI_KEY for abis='$ABIS'"

    # v1.51.1 — exact-key cache only (no restore-keys): binaries built from
    # another llama tag must never be silently reused. Deliberately WITHOUT
    # the NDK version: the NDK is irrelevant for a restored binary, and
    # runner NDK drift must not invalidate warm runs.
    - name: Restore llama-server cache
      id: llama-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/zagents-llama-runtime
        key: llama-runtime-${{ inputs.llama-tag }}-${{ steps.coverage.outputs.abi-key }}-v2

    # v1.51.1 — which requested ABIs are still missing after the restore?
    - name: Check cached ABIs
      id: matrix
      shell: bash
      env:
        ABIS: ${{ inputs.abis }}
      run: |
        set -euo pipefail
        MISSING=""
        for ABI in $ABIS; do
          if [ -f "$HOME/.cache/zagents-llama-runtime/$ABI/libllamaserver.so" ]; then
            echo "$ABI: runtime found in cache"
          else
            echo "$ABI: NOT cached - will build"
            MISSING="$MISSING $ABI"
          fi
        done
        MISSING=$(echo "$MISSING" | xargs)
        echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
        echo "missing-abis='$MISSING'"

    # v1.51.1 — resolve the NDK ONLY when something actually needs building.
    # Prefer the highest NDK preinstalled under $ANDROID_HOME/ndk; the 2026
    # runner images often ship none, so the sdkmanager fallback accepts
    # licenses and probes every known cmdline-tools location.
    - name: Resolve NDK
      id: ndk
      if: steps.matrix.outputs.missing != ''
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        # Highest version wins; `|| true` keeps the glob-miss from failing.
        NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
        if [ -z "$NDK_DIR" ] || [ ! -f "$NDK_DIR/build/cmake/android.toolchain.cmake" ]; then
          echo "No usable preinstalled NDK - installing pinned ndk;27.2.12479018"
          SDKMANAGER=""
          for CAND in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$CAND" ] && [ -x "$CAND" ]; then SDKMANAGER="$CAND"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No preinstalled NDK under $SDK/ndk and no sdkmanager found (looked in cmdline-tools/{latest,bin} and PATH)."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;27.2.12479018" >/dev/null || true
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
        fi
        if [ -z "$NDK_DIR" ] || [ ! -f "$NDK_DIR/build/cmake/android.toolchain.cmake" ]; then
          echo "::error::No usable Android NDK found in $SDK/ndk (pinned install failed too)."
          exit 1
        fi
        echo "Using NDK $(basename "$NDK_DIR") at $NDK_DIR"
        echo "ndk-dir=$NDK_DIR" >> "$GITHUB_OUTPUT"

    # v1.51.1 — build ONLY the ABIs the cache did not provide (skipped
    # entirely on warm runs). LLAMA_BUILD_TOOLS stays ON on purpose:
    # llama-server lives under tools/ and is gated by that flag in this
    # tag; extra tool binaries stay in $RUNNER_TEMP (not copied).
    # GGML_NATIVE=OFF keeps -march=native from leaking host CPU features
    # into the cross-compiled binary (would SIGILL on emulators / devices).
    - name: Build llama-server (cached ABIs are skipped)
      if: steps.matrix.outputs.missing != ''
      shell: bash
      env:
        ABIS: ${{ steps.matrix.outputs.missing }}
        LLAMA_TAG: ${{ inputs.llama-tag }}
        NDK_DIR: ${{ steps.ndk.outputs.ndk-dir }}
      run: |
        set -euo pipefail
        for ABI in $ABIS; do
          CACHE_SO="$HOME/.cache/zagents-llama-runtime/$ABI/libllamaserver.so"
          if [ -f "$CACHE_SO" ]; then
            echo "$ABI: runtime found in cache - skipping build"
            continue
          fi
          echo "$ABI: building llama-server from llama.cpp $LLAMA_TAG"
          if [ ! -d "$RUNNER_TEMP/llama.cpp" ]; then
            git clone --depth 1 --branch "$LLAMA_TAG" \
              https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          fi
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/build-$ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build "$RUNNER_TEMP/build-$ABI" --config Release --parallel "$(nproc)"
          mkdir -p "$(dirname "$CACHE_SO")"
          cp "$RUNNER_TEMP/build-$ABI/bin/llama-server" "$CACHE_SO"
        done

    # v1.51.0 — copy into the workspace and verify: every requested ABI must
    # get a 64-bit ELF for the right machine, otherwise the APK would ship
    # without the runtime and the app would silently degrade.
    - name: Inject libllamaserver.so into jniLibs and verify
      shell: bash
      env:
        ABIS: ${{ inputs.abis }}
      run: |
        set -euo pipefail
        for ABI in $ABIS; do
          CACHE_SO="$HOME/.cache/zagents-llama-runtime/$ABI/libllamaserver.so"
          DEST="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI/libllamaserver.so"
          if [ ! -f "$CACHE_SO" ]; then
            echo "::error::Runtime for $ABI was neither cached nor built ($CACHE_SO missing)."
            exit 1
          fi
          mkdir -p "$(dirname "$DEST")"
          cp "$CACHE_SO" "$DEST"
          # v1.51.2 — size + hash at every stage: the APK shipped stub
          # ELFs (4-7 KB) twice, and only sizes/hashes pinpoint WHICH
          # stage corrupts the executable.
          ls -la "$CACHE_SO" "$DEST"
          sha256sum "$CACHE_SO" "$DEST"
          FILE_OUT=$(file -b "$DEST")
          echo "$ABI -> $DEST: $FILE_OUT"
          case "$ABI" in
            arm64-v8a) EXPECT='aarch64' ;;
            x86_64)    EXPECT='x86-64' ;;
            *)         EXPECT='' ;;
          esac
          if ! echo "$FILE_OUT" | grep -q '^ELF 64-bit'; then
            echo "::error::$DEST is not a 64-bit ELF: $FILE_OUT"
            exit 1
          fi
          if [ -n "$EXPECT" ] && ! echo "$FILE_OUT" | grep -q "$EXPECT"; then
            echo "::error::$DEST: expected a $EXPECT binary for $ABI, got: $FILE_OUT"
            exit 1
          fi
          echo "OK: $ABI runtime injected and verified."
        done
