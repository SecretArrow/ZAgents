name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Quality gate (analyze + tests)
        run: |
          flutter analyze
          flutter test

      - name: Restore signing keystore (unzip encrypted bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret KEYSTORE_PASSWORD is not set - the release APK will be debug-signed (fallback)."
            exit 0
          fi
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          mkdir -p android/keystore
          7z x -y -p"$KEYSTORE_PASSWORD" -oandroid/keystore key-sign-apk.zip
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/keystore/zagents-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=zagents" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        if: env.SIGNED_BUILD == 'true'
        run: |
          if ! command -v apksigner >/dev/null 2>&1; then
            sudo apt-get install -y -qq apksigner
          fi
          apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Delete unzipped keystore (always, even on failure)
        if: always()
        run: rm -rf android/keystore

      - name: Organize artifacts
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p build-outputs
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build-outputs/ZAgents-${VERSION}-${GITHUB_REF_NAME}.apk"
          ls -lh build-outputs

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build-outputs/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-outputs/*.apk
          generate_release_notes: true
          make_latest: true
