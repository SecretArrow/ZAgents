name: Auto Release

# v1.38.1 — completes the "auto fix, auto release" loop: when main
# carries a pubspec version that has no tag yet, tag it. The tag triggers
# release.yml (quality gate -> signed APK -> GitHub Release). Idempotent:
# an existing tag never re-releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-new-version:
    name: Tag new pubspec version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ -z "$VERSION" ]; then
            echo "::error::No version in pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pubspec version: $VERSION"

      - name: Create tag when missing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUSH_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists — nothing to release."
            exit 0
          fi
          # Guard: never tag an auto-fix commit (no version change there).
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == chore\(auto-fix\)* ]]; then
            echo "Last commit is an auto-fix; skipping tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "ZAgents v$VERSION"
          # Push with the repo-scoped PAT secret: tag pushes made with the
          # default GITHUB_TOKEN do NOT trigger other workflows (GitHub
          # anti-recursion), so release.yml would never run. The PAT lives
          # only in the encrypted AUTO_RELEASE_TOKEN secret.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"
          echo "Tag v$VERSION pushed — release.yml will build & publish the signed APK."
