name: Auto Release

# v1.38.1 — completes the "auto fix, auto release" loop: when main
# carries a pubspec version that has no tag yet, tag it. The tag triggers
# release.yml (quality gate -> signed APK -> GitHub Release). Idempotent:
# an existing tag never re-releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-new-version:
    name: Tag new pubspec version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ -z "$VERSION" ]; then
            echo "::error::No version in pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pubspec version: $VERSION"

      - name: Create tag when missing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUSH_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists — nothing to release."
            exit 0
          fi
          # Guard: never tag an auto-fix commit (no version change there).
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == chore\(auto-fix\)* ]]; then
            echo "Last commit is an auto-fix; skipping tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Create the tag via the REST API with the PAT secret. Two reasons
          # git push is not used here:
          #  1. actions/checkout installs a GITHUB_TOKEN extraheader that
          #     wins over URL-embedded credentials — the push would be
          #     attributed to GITHUB_TOKEN and GitHub suppresses workflow
          #     triggers for its events (release.yml would never run).
          #  2. REST API calls with a real PAT always fire push events.
          TAG_SHA="${GITHUB_SHA}"
          TAGOBJ=$(curl -sf -X POST \
            -H "Authorization: Bearer ${PUSH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags" \
            -d "{\"tag\":\"v$VERSION\",\"message\":\"ZAgents v$VERSION\",\"object\":\"$TAG_SHA\",\"type\":\"commit\"}")
          if [ -z "$TAGOBJ" ]; then
            echo "::error::Failed to create tag object v$VERSION"
            exit 1
          fi
          TAGOBJ_SHA=$(echo "$TAGOBJ" | sed -n 's/.*"sha": *"\([0-9a-f]*\)".*/\1/p' | head -1)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${PUSH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/v$VERSION\",\"sha\":\"$TAGOBJ_SHA\"}")
          case "$HTTP" in
            201) echo "Tag v$VERSION created — release.yml will build & publish the signed APK." ;;
            422) echo "Tag v$VERSION already exists — nothing to release." ;;
            *) echo "::error::Failed to create ref v$VERSION (HTTP $HTTP)"; exit 1 ;;
          esac
