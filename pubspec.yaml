name: zagents
description: "ZAgents - AI agent chat Android (gaya Z.AI agent mode) dengan custom provider (OpenRouter, InferHub, Z.AI, OpenAI, dll), katalog model live + pencarian/filter/paging, dan otomasi browser."
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  flutter_inappwebview: ^6.1.5
  flutter_markdown: ^0.7.6
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  archive: ^4.5.2
  share_plus: ^13.3.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
