name: zagents
description: "ZAgents - AI agent chat Android (gaya Z.AI agent mode) dengan custom provider (OpenRouter, InferHub, Z.AI, OpenAI, dll), katalog model live + pencarian/filter/paging, dan otomasi browser."
publish_to: 'none'
version: 1.49.8+75

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  flutter_inappwebview: ^6.1.5
  flutter_markdown: ^0.7.6
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  archive: ^4.5.2
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  image: ^4.2.2
  pointycastle: ^4.0.0
  local_auth: ^2.3.0
  crypto: ^3.0.3
  meta: ^1.16.0
  flutter_secure_storage: ^11.2.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - sdk/zagents-sdk.js
    - docs/modules/sdk-reference-en.md
    - docs/modules/sdk-reference-id.md
    - assets/skills/web3-wallet-basics/SKILL.md
    - assets/skills/binance-agentic-wallet/SKILL.md

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0E12"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 23
